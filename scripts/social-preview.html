<!doctype html><html><head><meta charset="utf-8"><style>
  /* Обложка репозитория для соцсетей, 1280×640. Круглые кнопки взяты один в
     один из расширения — те же круги, те же иконки, та же толщина штриха.
     Текст слева: его читают раньше картинки. Фон и чернила из палитры сайта.

     Пересобрать:
       chrome --headless --force-device-scale-factor=2 \
         --window-size=1280,640 --screenshot=out.png file://.../social-preview.html
  */
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1280px;height:640px}
  body{background:#faf2e6;display:flex;align-items:center;justify-content:center;gap:72px;
       font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif}
  .txt{display:flex;flex-direction:column;gap:12px}
  h1{font-size:96px;line-height:.92;font-weight:600;letter-spacing:-.035em;color:#030303}
  p{font-size:28px;line-height:1.35;color:rgba(3,3,3,.55);font-weight:400;white-space:nowrap}
  .row{display:flex;gap:24px;flex:none}
  .btn{width:150px;height:150px;border-radius:50%;background:#262626;display:grid;
       place-items:center;box-shadow:0 18px 44px rgba(3,3,3,.16)}
  .btn svg{width:68px;height:68px;display:block}
</style></head><body>
  <div class="txt"><h1>Stash</h1><p>Photos, videos and music,<br>saved in one press</p></div>
  <div class="row">
    <div class="btn"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 18V5l10-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/></svg></div>
    <div class="btn"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 4v12"/><path d="M6 12 9 15q3 4 6 0L18 12"/><path d="M5 20h14"/></svg></div>
  </div>
</body></html>
