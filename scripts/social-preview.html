<!doctype html><html><head><meta charset="utf-8"><style>
  /* Обложка Stash. Кнопки взяты один в один из расширения — те же круги, те же
     иконки, та же толщина штриха. Фон и чернила из палитры сайта. */
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1280px;height:640px}
  body{background:#faf2e6;display:flex;align-items:center;justify-content:center;gap:60px;
       font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif}
  .row{display:flex;gap:24px;flex:none}
  .btn{width:132px;height:132px;border-radius:50%;background:#262626;display:grid;place-items:center;
       box-shadow:0 18px 44px rgba(3,3,3,.16)}
  .btn svg{width:60px;height:60px;display:block}
  .txt{display:flex;flex-direction:column;gap:12px}
  h1{font-size:96px;line-height:.92;font-weight:600;letter-spacing:-.035em;color:#030303}
  p{font-size:28px;line-height:1.35;color:rgba(3,3,3,.55);max-width:16ch;font-weight:400}
</style></head><body>
  <div class="row">
    <div class="btn"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 18V5l10-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/></svg></div>
    <div class="btn"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 4v12"/><path d="M6 12l6 6 6-6"/><path d="M5 20h14"/></svg></div>
  </div>
  <div class="txt"><h1>Stash</h1><p>Photos, videos and their music, saved in one press</p></div>
</body></html>
